<body>
    <!--
        The icon is the Copilot mark, drawn as an inline SVG rather than a DynamicsFont glyph class: the
        POS icon font has no Copilot glyph. It keeps its own gradient colours, so it reads the same in
        every POS theme. Gradient ids are document-wide, so each template uses its own. The packed copy
        is drawn at 20px, like the other packed header items, so its row in the overflow list matches
        theirs.

        While the panel is open the unpacked button is shaded darker with an inset shadow, which sits
        over whatever background the POS theme gives the header, so it follows the theme's accent colour
        and still changes on hover. aria-expanded tells assistive technology the same thing.
    -->
