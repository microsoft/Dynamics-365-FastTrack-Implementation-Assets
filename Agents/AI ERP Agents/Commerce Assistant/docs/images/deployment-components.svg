<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title description" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">Commerce Assistant deployment components</title>
  <desc id="description">POS sends chat and attachments through Azure API Management to Microsoft Foundry. API Management reads assistant instructions from Blob Storage. Foundry calls Commerce MCP tools on the Commerce Scale Unit and retrieves store knowledge from Azure AI Search through Foundry IQ. POS also calls Commerce services directly for gateway configuration and cart and delivery operations. Arrows show requests; responses return along the same paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#526477"/>
    </marker>
    <style>
      .zone-title { font-size: 17px; font-weight: 700; fill: #334155; }
      .card-title { font-size: 18px; font-weight: 700; fill: #172554; }
      .detail { font-size: 15px; fill: #334155; }
      .label { font-size: 13px; fill: #334155; }
      .card { stroke-width: 1.5; rx: 12; }
      .flow { fill: none; stroke: #526477; stroke-width: 2; marker-end: url(#arrow); }
      .direct { stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect width="1280" height="700" fill="#ffffff"/>
  <text x="640" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Commerce Assistant - Deployment Components</text>
  <text x="640" y="66" text-anchor="middle" class="detail">Chat, Commerce actions, and store knowledge</text>

  <rect x="24" y="104" width="230" height="520" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="138" class="zone-title">POS device</text>

  <rect x="290" y="104" width="650" height="520" rx="16" fill="#f0f7ff" stroke="#bad5f0"/>
  <text x="312" y="138" class="zone-title">Your Azure subscription</text>

  <rect x="976" y="104" width="280" height="520" rx="16" fill="#f5f3ff" stroke="#d4cbeb"/>
  <text x="996" y="138" class="zone-title">Your Commerce environment</text>

  <rect x="44" y="225" width="190" height="125" class="card" fill="#ffffff" stroke="#64748b"/>
  <text x="139" y="255" text-anchor="middle" class="card-title">Assistant panel</text>
  <text x="139" y="281" text-anchor="middle" class="detail">Cloud POS or</text>
  <text x="139" y="304" text-anchor="middle" class="detail">Windows Store Commerce</text>
  <text x="139" y="328" text-anchor="middle" class="label">Product cards and actions</text>

  <rect x="315" y="225" width="215" height="125" class="card" fill="#ffffff" stroke="#1473ba"/>
  <text x="422" y="257" text-anchor="middle" class="card-title">API Management</text>
  <text x="422" y="283" text-anchor="middle" class="detail">Authenticate and route</text>
  <text x="422" y="307" text-anchor="middle" class="detail">Chat and attachment APIs</text>

  <rect x="625" y="225" width="285" height="125" class="card" fill="#ffffff" stroke="#7852b3"/>
  <text x="767" y="257" text-anchor="middle" class="card-title">Microsoft Foundry</text>
  <text x="767" y="283" text-anchor="middle" class="detail">Model and Responses API</text>
  <text x="767" y="307" text-anchor="middle" class="detail">Commerce and knowledge tools</text>

  <rect x="325" y="435" width="205" height="105" class="card" fill="#ffffff" stroke="#22815c"/>
  <text x="427" y="466" text-anchor="middle" class="card-title">Azure Blob Storage</text>
  <text x="427" y="491" text-anchor="middle" class="detail">Assistant instructions</text>
  <text x="427" y="514" text-anchor="middle" class="detail">Store-specific guidance</text>

  <rect x="625" y="435" width="285" height="105" class="card" fill="#ffffff" stroke="#b37a16"/>
  <text x="767" y="466" text-anchor="middle" class="card-title">Azure AI Search</text>
  <text x="767" y="491" text-anchor="middle" class="detail">Foundry IQ knowledge base</text>
  <text x="767" y="514" text-anchor="middle" class="detail">Product guides and policies</text>

  <rect x="996" y="225" width="240" height="125" class="card" fill="#ffffff" stroke="#7852b3"/>
  <text x="1116" y="257" text-anchor="middle" class="card-title">Commerce Scale Unit</text>
  <text x="1116" y="283" text-anchor="middle" class="detail">Commerce MCP tools</text>
  <text x="1116" y="307" text-anchor="middle" class="detail">Products, customers, carts,</text>
  <text x="1116" y="328" text-anchor="middle" class="detail">and orders</text>

  <rect x="996" y="435" width="240" height="105" class="card" fill="#ffffff" stroke="#7852b3"/>
  <text x="1116" y="466" text-anchor="middle" class="card-title">POS services + extension</text>
  <text x="1116" y="491" text-anchor="middle" class="detail">Gateway configuration</text>
  <text x="1116" y="514" text-anchor="middle" class="detail">Cart and delivery operations</text>

  <path class="flow" d="M234,250 H315"/>
  <text x="274" y="236" text-anchor="middle" class="label">HTTPS</text>
  <path class="flow" d="M530,285 H625"/>
  <text x="577" y="270" text-anchor="middle" class="label">Chat + files</text>
  <path class="flow" d="M910,285 H996"/>
  <text x="953" y="270" text-anchor="middle" class="label">Tool calls</text>
  <path class="flow" d="M422,350 V435"/>
  <text x="437" y="399" class="label">Read rules</text>
  <path class="flow" d="M767,350 V435"/>
  <text x="782" y="399" class="label">Retrieve</text>

  <path class="flow direct" d="M139,350 V582 H1116 V540"/>
  <text x="640" y="572" text-anchor="middle" class="detail">POS operations and gateway configuration (direct to Commerce)</text>

  <text x="640" y="665" text-anchor="middle" class="detail">Arrows show requests; responses return along the same paths.</text>
</svg>
